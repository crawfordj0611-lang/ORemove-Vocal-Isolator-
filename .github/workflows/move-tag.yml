# One-off: points a release's tag at the current commit (used after rewriting
# history). The release and its downloads are kept.
name: Move tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to move"
        required: true
      release_id:
        description: "Release ID (from the GitHub API)"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      # The workflow token may only create a tag at the commit it runs from.
      - name: Point the release's tag at this commit
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || echo "No existing tag $TAG"
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=false -f make_latest=true --jq '.html_url, .draft'
          echo "Tag now at $(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
