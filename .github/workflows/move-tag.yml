# One-off: points a release's tag at a different commit (used after rewriting
# history). Deletes the tag, then edits the release so GitHub recreates the
# tag at the new commit; the release and its downloads are kept.
name: Move tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to move"
        required: true
      commit:
        description: "Commit to point it at (full SHA)"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Move the tag
        run: |
          id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)
          echo "Release $id; tag currently at $(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
          gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name="$TAG" -f target_commitish="$COMMIT" -F draft=false -F make_latest=true --jq '.html_url, .draft'
          echo "Tag now at $(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
