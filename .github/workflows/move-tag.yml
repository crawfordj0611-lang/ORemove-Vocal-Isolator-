# One-off: points a tag at a different commit (used after rewriting history).
name: Move tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to move"
        required: true
      commit:
        description: "Commit to point it at"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tag
        run: |
          git tag -f "${{ inputs.tag }}" "${{ inputs.commit }}"
          git push -f origin "refs/tags/${{ inputs.tag }}"
          git ls-remote --tags origin "${{ inputs.tag }}"
