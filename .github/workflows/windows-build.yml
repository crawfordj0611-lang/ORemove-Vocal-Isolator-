# Builds the Windows app in two flavours on Windows runners, tests each built
# .exe, and publishes both to a GitHub Release:
#   cpu  - portable zip, runs on any PC
#   cuda - installer for NVIDIA GPUs (RTX/GTX), split into parts under 2 GB
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to create (leave empty to only build)"
        default: "v1.1.0"
      editions:
        description: 'Editions to build, as a JSON list: ["cpu","cuda"], ["cpu"] or ["cuda"]'
        default: '["cpu","cuda"]'

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.editions || '["cpu","cuda"]') }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      APP_NAME: ORemove
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torchvision (used by onnx2torch to load models) must come from the
          # same index so its compiled operators match torch.
          # CUDA 12.6 build for the NVIDIA edition: GTX 900 series through RTX 40 series.
          pip install torch torchvision --index-url ${{ matrix.flavor == 'cuda' && 'https://download.pytorch.org/whl/cu126' || 'https://download.pytorch.org/whl/cpu' }}
          pip install -r requirements.txt
          pip install pyinstaller pip-licenses

      # LGPL build (not GPL): looser terms for redistributing it with the app.
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Copy-Item (Join-Path $bin.DirectoryName "ffmpeg.exe"), (Join-Path $bin.DirectoryName "ffprobe.exe") ffmpeg-bin
          $license = Get-ChildItem ffmpeg -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName ffmpeg-bin/FFMPEG-COPYING.txt }
          # MP3 export needs the LAME encoder; fail the build if this FFmpeg lacks it.
          $encoders = & ffmpeg-bin/ffmpeg.exe -hide_banner -encoders
          if (-not ($encoders | Select-String libmp3lame)) { throw "FFmpeg build has no MP3 encoder" }

      # Same check as the .exe self-test below, but from source: if this fails,
      # the problem is a dependency, not the packaging. Runs every model (on
      # CPU: the runners have no GPU) and downloads them into models/.
      - name: Self-test from source
        shell: pwsh
        run: |
          $env:PATH = "$PWD\ffmpeg-bin;$env:PATH"
          python app.py --self-test source-test.txt
          $code = $LASTEXITCODE
          Get-Content source-test.txt
          if ($code -ne 0) { throw "Source self-test failed" }

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "${{ env.APP_NAME }}"
          --collect-all customtkinter
          --collect-all audio_separator
          --copy-metadata audio-separator
          --collect-all onnxruntime
          --collect-all torchvision
          --collect-all samplerate
          --collect-data librosa
          --collect-data resampy
          app.py

      - name: Add FFmpeg, models, docs and licenses
        shell: pwsh
        run: |
          $dist = "dist/$env:APP_NAME"
          Copy-Item ffmpeg-bin/* $dist
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md $dist
          Copy-Item models $dist -Recurse  # all models, so the next step doesn't re-download them
          # Full license text of every bundled Python package.
          pip-licenses --with-license-file --no-license-path --with-urls --format=plain-vertical --output-file "$dist/THIRD-PARTY-LICENSES.txt"
          $version = (& ffmpeg-bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1)
          @(
            "ffmpeg.exe and ffprobe.exe are FFmpeg, licensed under the GNU LGPL 2.1 or later",
            "(full text: FFMPEG-COPYING.txt). They are unmodified LGPL builds from",
            "https://github.com/BtbN/FFmpeg-Builds (ffmpeg-master-latest-win64-lgpl).",
            "",
            "Build: $version",
            "",
            "Source code: https://github.com/FFmpeg/FFmpeg and https://ffmpeg.org/download.html",
            "Build scripts: https://github.com/BtbN/FFmpeg-Builds"
          ) | Set-Content "$dist/FFMPEG-LICENSE.txt"

      # Runs the real .exe on every model: generates a test tone, separates it,
      # and checks an acapella and an instrumental are written.
      - name: Self-test the built app
        shell: pwsh
        run: |
          $dist = "dist/$env:APP_NAME"
          $p = Start-Process -FilePath "$dist/$env:APP_NAME.exe" -ArgumentList "--self-test", "$PWD/self-test.txt" -Wait -PassThru
          if (Test-Path self-test.txt) { Get-Content self-test.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          # Ship only the small fast model; the large Roformer models download on first use.
          Get-ChildItem "$dist/models" -Include *.ckpt, *.yaml -Recurse | Remove-Item

      - name: Package (portable zip)
        if: matrix.flavor == 'cpu'
        shell: pwsh
        run: 7z a -tzip -mx=5 ORemove-Windows-CPU.zip "./dist/$env:APP_NAME"

      - name: Package (installer)
        if: matrix.flavor == 'cuda'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:APP_VERSION = "$env:VERSION".TrimStart("v")
          if (-not $env:APP_VERSION) { $env:APP_VERSION = "0.0.0" }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer-out | Format-Table Name, Length

      # The runner has no NVIDIA GPU, so with message boxes suppressed (they
      # answer "No") setup must refuse. Then install for real with the check
      # skipped, to prove the installer works, and uninstall again.
      - name: Test the installer
        if: matrix.flavor == 'cuda'
        shell: pwsh
        run: |
          $setup = "installer-out/ORemove-NVIDIA-GPU-Setup.exe"
          $dir = "$env:RUNNER_TEMP\oremove-install"
          $quiet = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          # Never wait forever: a dialog nobody can click would hang the build.
          function Run-Setup($file, $arguments, $minutes) {
            $p = Start-Process $file -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($minutes * 60000)) { $p.Kill(); throw "$file timed out (waiting for a dialog?)" }
            return $p.ExitCode
          }
          $code = Run-Setup $setup $quiet 3
          if (Test-Path "$dir\$env:APP_NAME.exe") { throw "Setup installed on a PC without an NVIDIA GPU" }
          Write-Host "Refused on a PC without an NVIDIA GPU (exit code $code), as intended"
          $code = Run-Setup $setup ($quiet + "/SKIPGPUCHECK=1") 20
          if ($code -ne 0 -or -not (Test-Path "$dir\$env:APP_NAME.exe")) { throw "Install failed (exit code $code)" }
          Write-Host "Installed OK"
          Run-Setup "$dir\unins000.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES") 10 | Out-Null

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # A manual run creates the tag from its version input.
          tag_name: ${{ env.VERSION }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.flavor == 'cpu' && 'ORemove-Windows-CPU.zip' || 'installer-out/*' }}
          body_path: .github/release-notes.md
