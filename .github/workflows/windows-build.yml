# Builds the Windows app on a Windows runner, tests the built .exe, and
# publishes it as a GitHub Release when a version tag (v*) is pushed.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to create (leave empty to only build)"
        default: "v1.0.0"

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_NAME: YT Stem Extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build of PyTorch: works on every PC and keeps the download small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Copy-Item (Join-Path $bin.DirectoryName "ffmpeg.exe"), (Join-Path $bin.DirectoryName "ffprobe.exe") ffmpeg-bin

      # Same check as the .exe self-test below, but from source: if this fails,
      # the problem is a dependency, not the packaging. Also downloads the
      # default model into models/.
      - name: Self-test from source
        shell: pwsh
        run: |
          python app.py --self-test source-test.txt
          $code = $LASTEXITCODE
          Get-Content source-test.txt
          if ($code -ne 0) { throw "Source self-test failed" }

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "${{ env.APP_NAME }}"
          --collect-all customtkinter
          --collect-all audio_separator
          --copy-metadata audio-separator
          --collect-all onnxruntime
          --collect-all samplerate
          --collect-data librosa
          --collect-data resampy
          app.py

      - name: Add FFmpeg and docs
        shell: pwsh
        run: |
          $dist = "dist/$env:APP_NAME"
          Copy-Item ffmpeg-bin/* $dist
          Copy-Item README.md $dist
          Copy-Item models $dist -Recurse  # default UVR model, downloaded by the source self-test
          "FFmpeg (ffmpeg.exe, ffprobe.exe) is from https://github.com/BtbN/FFmpeg-Builds and is licensed under the GPL." | Set-Content "$dist/FFMPEG-LICENSE.txt"

      # Runs the real .exe: generates a test tone, separates it with the default
      # UVR model, and checks both stems are written. This also downloads that
      # model into models/, so it ships inside the zip (no first-run download).
      - name: Self-test the built app
        shell: pwsh
        run: |
          $dist = "dist/$env:APP_NAME"
          $p = Start-Process -FilePath "$dist/$env:APP_NAME.exe" -ArgumentList "--self-test", "$PWD/self-test.txt" -Wait -PassThru
          if (Test-Path self-test.txt) { Get-Content self-test.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: 7z a -tzip -mx=5 YT-Stem-Extractor-Windows.zip "./dist/$env:APP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Stem-Extractor-Windows
          path: YT-Stem-Extractor-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # A manual run creates the tag from its version input.
          tag_name: ${{ inputs.version || github.ref_name }}
          make_latest: true
          files: YT-Stem-Extractor-Windows.zip
          body: |
            Windows build of YT Stem Extractor & UVR Studio.

            1. Download **YT-Stem-Extractor-Windows.zip** and extract it.
            2. Open the `YT Stem Extractor` folder and run `YT Stem Extractor.exe`.

            FFmpeg and the default UVR model are included. Runs on the CPU (no NVIDIA setup needed).
            Windows SmartScreen may warn because the app isn't code-signed: click "More info" → "Run anyway".
